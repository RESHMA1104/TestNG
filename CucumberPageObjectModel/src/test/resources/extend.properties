# Spark Report (MAIN)
extent.reporter.spark.start=true
extent.reporter.spark.out=target/ExtentReports/Spark.html

# Optional HTML Report
extent.reporter.html.start=true
extent.reporter.html.out=target/ExtentReports/HtmlReport.html

# Optional PDF Report
extent.reporter.pdf.start=true
extent.reporter.pdf.out=target/ExtentReports/PdfReport.pdf

# Folder Naming
basefolder.name=ExtentReports/SparkReport_
basefolder.datetimepattern=d_MMM_YY_HH_mm_ss

# Screenshots
screenshot.dir=target/Screenshots/
screenshot.rel.path=../Screenshots/

# Base64 screenshots (important for embedding)
extent.reporter.spark.base64imagesrc=true

# System Info
systeminfo.os=Windows
systeminfo.version=10